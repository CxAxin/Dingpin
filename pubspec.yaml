name: pinnit_flutter
description: A Flutter reimplementation of Pinnit - pin notes & notifications to your notification panel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local unique ids
  uuid: ^4.4.0

  # Local persistence (Room equivalent)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Date formatting
  intl: ^0.20.2

  # System notifications: pinned (ongoing) notification permission checks
  flutter_local_notifications: ^17.2.0

  # First-party localization delegates (Material/Cupertino zh_CN, etc.)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
