name: pinnit_flutter
description: A Flutter reimplementation of Pinnit - pin notes & notifications to your notification panel.
publish_to: 'none'
version: 2.9.3+293

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local unique ids
  uuid: ^4.4.0

  # Local persistence (Room equivalent)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Date formatting
  intl: ^0.20.2

  # System notifications: pinned (ongoing) notification permission checks
  flutter_local_notifications: ^17.2.0

  # First-party localization delegates (Material/Cupertino zh_CN, etc.)
  flutter_localizations:
    sdk: flutter

  # Persist the user's language preference (follow system / zh / en)
  shared_preferences: ^2.3.2

  # Liquid Glass UI effect (Apple iOS-style glassmorphism)
  liquid_glass_easy: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

# Local patch: sqflite_android 2.4.4 uses Java 19 SE APIs (Locale.of / Thread.threadId)
# which fail to compile under the JDK 17 toolchain bundled with Flutter 3.44.8
# (compileSdk 36). This override points at a locally patched copy that uses the
# JDK 17-safe equivalents (new Locale(...) / getId()). See packages/sqflite_android.
dependency_overrides:
  sqflite_android:
    path: packages/sqflite_android
  # path_provider_android 2.3.1 pulls `jni 1.0.3`, whose Gradle build compiles+
  # links libjni.so via CMake and requires a *complete* NDK sysroot (libc/crt/
  # builtins). The local Android SDK's NDK has an empty sysroot/usr/lib, so the
  # native link fails with "unable to find library -lc". 2.2.20 is the last
  # MethodChannel-based release (no jni, no native build) and still satisfies
  # path_provider 2.1.6's `^2.2.5` constraint. Pin it to bypass the dead NDK.
  path_provider_android: 2.2.20
