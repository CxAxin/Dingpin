# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.useAndroidX=true
android.enableJetifier=true
# Keep the Gradle/ JVM footprint minimal so the sandbox can fork it.
# Xmx is intentionally modest: the host has only ~15G RAM and the Gradle
# daemon + Kotlin compiler + dex desugaring compete for native memory. A too
# large Java heap starves native allocations and crashes the daemon.
#
# IMPORTANT: HeapBaseMinAddress pushes the Java heap ABOVE 4GB. By default
# Temurin 17 places the heap in the lower 4GB (compressed oops), which
# starves the native heap (JIT / C2 compiler) of address space and crashes
# the daemon mid-build (Out of Memory on native malloc). Moving the heap up
# frees the entire low 4GB for native allocations.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:HeapBaseMinAddress=0x0000000200000000 -XX:CICompilerCount=2 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# Run Kotlin compilation inside the Gradle process to avoid a second JVM
# eating into the already tight memory budget.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -XX:HeapBaseMinAddress=0x0000000200000000

# Java toolchain: force Gradle to use the LOCAL Temurin JDK-17 and NEVER try to
# auto-download one. This host's egress proxy is dead, so auto-download would
# leave the compile toolchain's JavaCompiler provider empty, and AGP's
# `androidJdkImage` configuration (a self-resolving file dependency on that
# JavaCompiler) then dies at :app:compileReleaseJavaWithJavac with
#   "Cannot query the value of this provider because it has no value available".
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.paths=C:/android-build/jdk/extracted/jdk-17.0.10+7

